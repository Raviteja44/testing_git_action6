name: Promote Code Between Environments

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch (feature, dev, or uat)"
        required: true
        type: string
      target_environment:
        description: "Environment to promote into"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      deployment_reason:
        description: "Reason for promotion"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set environment variables
        run: |
          echo "SOURCE_BRANCH=${{ github.event.inputs.source_branch }}" >> $GITHUB_ENV
          echo "TARGET_BRANCH=${{ github.event.inputs.target_environment }}" >> $GITHUB_ENV
        shell: bash

      - name: Fetch source and target branches
        run: |
          set -e

          # handle forked branch owner:branch
          if [[ "$SOURCE_BRANCH" == *:* ]]; then
            OWNER="${SOURCE_BRANCH%%:*}"
            BRANCH="${SOURCE_BRANCH#*:}"
            echo "Using fork branch: owner=$OWNER branch=$BRANCH"
            git remote add fork "https://github.com/$OWNER/${{ github.repository#*/ }}" || true
            git fetch fork "$BRANCH"
            git fetch origin "$TARGET_BRANCH"
            git checkout -B source-branch "fork/$BRANCH"
          else
            git fetch origin "$SOURCE_BRANCH"
            git fetch origin "$TARGET_BRANCH"
            git checkout -B source-branch "origin/$SOURCE_BRANCH"
          fi

          git checkout -B target-branch "origin/$TARGET_BRANCH"
        shell: bash

      - name: Compare source and target branches
        id: diff
        run: |
          set -e
          CHANGED_FILES=$(git diff --name-only origin/$TARGET_BRANCH...origin/$SOURCE_BRANCH)

          if [ -z "$CHANGED_FILES" ]; then
            echo "changed_files=" >> $GITHUB_OUTPUT
            echo "change_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          {
            echo "changed_files<<EOF"
            printf '%s\n' "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          COUNT=$(echo "$CHANGED_FILES" | wc -l)
          echo "change_count=${COUNT}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Skip PR if no differences
        if: ${{ steps.diff.outputs.change_count == '0' }}
        run: echo "No differences ― skipping PR creation."

      - name: Create Promotion PR
        if: ${{ steps.diff.outputs.change_count != '0' }}
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
          CHANGE_COUNT: ${{ steps.diff.outputs.change_count }}
        with:
          script: |
            const source = process.env.SOURCE_BRANCH.trim();
            const target = process.env.TARGET_BRANCH.trim();
            const changed = process.env.CHANGED_FILES.split("\n").filter(Boolean);
            const count = Number(process.env.CHANGE_COUNT);

            // Check if PR already exists
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: source,
              base: target,
              state: "open"
            });

            if (existing.data.length > 0) {
              console.log("PR already exists: " + existing.data[0].html_url);
              return;
            }

            const body = [
              `## Promote ${source} → ${target}`,
              `**Reason:** ${process.env.DEPLOYMENT_REASON}`,
              ``,
              `### Changed files (${count})`,
              "```",
              ...changed,
              "```",
              "",
              "**CODEOWNERS review required**"
            ].join("\n");

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Promote ${source} → ${target}`,
              head: source,
              base: target,
              body
            });

            console.log("Created PR:", pr.html_url);
