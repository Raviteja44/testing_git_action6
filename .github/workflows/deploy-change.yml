name: Deploy Feature to Environment

on:
  push:
    # allow testing from feature branches; skip pushes to environment branches
    branches-ignore:
      - dev
      - uat
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      feature_branch:
        description: 'Feature branch to deploy'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for deployment'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-feature:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare run inputs (determine feature branch and base)
        id: prepare
        run: |
          set -e
          # Determine FEATURE_BRANCH:
          if [ -n "${{ github.event.inputs.feature_branch }}" ]; then
            echo "Using workflow_dispatch input feature_branch='${{ github.event.inputs.feature_branch }}'"
            echo "FEATURE_BRANCH=${{ github.event.inputs.feature_branch }}" >> $GITHUB_ENV
          elif [ -n "${{ github.head_ref }}" ]; then
            echo "Using github.head_ref='${{ github.head_ref }}'"
            echo "FEATURE_BRANCH=${{ github.head_ref }}" >> $GITHUB_ENV
          else
            REF_NAME="${GITHUB_REF#refs/heads/}"
            echo "Using GITHUB_REF branch='${REF_NAME}'"
            echo "FEATURE_BRANCH=${REF_NAME}" >> $GITHUB_ENV
          fi

          # Determine BASE_BRANCH for comparison / PR target:
          # - If manual dispatch provided environment, use that as base
          # - Otherwise default to 'dev' for push runs (so feature pushes compare to dev)
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            echo "Using workflow_dispatch input environment='${{ github.event.inputs.environment }}'"
            echo "BASE_BRANCH=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "BASE_BRANCH=dev" >> $GITHUB_ENV
          fi

          echo "Resolved FEATURE_BRANCH=${FEATURE_BRANCH}"
          echo "Resolved BASE_BRANCH=${BASE_BRANCH}"
        shell: bash

      - name: If manual run, fetch & checkout requested feature branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          echo "Manual dispatch: fetching feature branch '${{ env.FEATURE_BRANCH }}'"
          git fetch origin "${{ env.FEATURE_BRANCH }}" || true
          # checkout the remote branch if it exists, otherwise create local branch name
          git checkout -B "${{ env.FEATURE_BRANCH }}" "origin/${{ env.FEATURE_BRANCH }}" || git checkout -B "${{ env.FEATURE_BRANCH }}"
          git rev-parse --abbrev-ref HEAD
        shell: bash

      - name: Get changes vs base branch
        id: changes
        run: |
          set -e
          BASE="${BASE_BRANCH:-dev}"
          echo "Comparing against base branch: $BASE"
          git fetch origin "$BASE" || true
          CHANGED_FILES="$(git diff --name-only origin/${BASE}...HEAD || true)"

          # Write changed_files safely; if empty write an empty value
          if [ -z "$CHANGED_FILES" ]; then
            echo "changed_files=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed_files<<EOF"
              printf '%s\n' "$CHANGED_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          # Count non-empty lines for the change_count
          CHANGE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | grep -cve '^\s*$' || true)
          echo "change_count=$CHANGE_COUNT" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create Deployment PR (if applicable)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        uses: actions/github-script@v7
        env:
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
          CHANGE_COUNT: ${{ steps.changes.outputs.change_count }}
        with:
          script: |
            // Resolve inputs
            const featureBranch = process.env.FEATURE_BRANCH && process.env.FEATURE_BRANCH.trim();
            const baseBranch = process.env.BASE_BRANCH && process.env.BASE_BRANCH.trim() ? process.env.BASE_BRANCH.trim() : 'dev';
            const changedFiles = process.env.CHANGED_FILES
              ? process.env.CHANGED_FILES.split('\n').filter(Boolean)
              : [];
            const changeCount = Number(process.env.CHANGE_COUNT || changedFiles.length || 0);

            if (!featureBranch) {
              throw new Error(`FEATURE_BRANCH is empty — cannot create pull request.`);
            }

            // If no changes, skip PR creation
            if (changeCount === 0) {
              console.log(`No changes detected vs ${baseBranch} — skipping PR creation.`);
              return;
            }

            // Compose PR body safely (avoid embedding backticks/template-literals inside YAML)
            const prBodyLines = [
              `## Feature Deployment to ${baseBranch.toUpperCase()}`,
              `**Source Branch:** ${featureBranch}`,
              `**Target Environment:** ${baseBranch.toUpperCase()}`,
              `**Deployment Reason:** ${process.env.DEPLOYMENT_REASON || 'Automated PR'}`,
              '',
              `### Changes included (${changeCount} files):`,
              '```',
              ...changedFiles,
              '```',
              '',
              '**CODEOWNERS review required for deployment**'
            ];
            const prBody = prBodyLines.join('\n');

            // Avoid creating duplicate PRs from the same head -> base
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${featureBranch}`,
              base: baseBranch,
              state: 'open'
            });

            if (existing.data && existing.data.length > 0) {
              console.log(`Open PR already exists: ${existing.data[0].html_url}`);
              return;
            }

            // Create the PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 ${baseBranch.toUpperCase()}: Merge ${featureBranch} -> ${baseBranch}`,
              body: prBody,
              head: featureBranch,
              base: baseBranch
            });

            console.log(`✅ Deployment PR created: ${pr.html_url}`);

      - name: Deploy to Dev (simulated)
        if: ${{ env.BASE_BRANCH == 'dev' || github.event_name == 'push' }}
        run: |
          echo "🚀 (Simulated) Deploy to DEV"
          echo "Files changed: ${{ steps.changes.outputs.change_count }}"
          # Add your actual deployment commands for DEV here